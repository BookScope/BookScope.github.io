<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
  <!--
    BookScope mark: three book spines read as a rising bar chart, with the
    rank marker sitting on the tallest. Flat, two colours, legible at 16px.
  -->
  <rect width="128" height="128" rx="28" fill="#0F766E"/>
  <g fill="#FFFFFF">
    <rect x="24" y="72" width="20" height="36" rx="3"/>
    <rect x="54" y="52" width="20" height="56" rx="3"/>
    <rect x="84" y="30" width="20" height="78" rx="3"/>
  </g>
  <circle cx="94" cy="21" r="9" fill="#FFE566"/>
</svg>
